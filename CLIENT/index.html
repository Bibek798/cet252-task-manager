<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f5f5f5;
        }

        header {
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }

        h1 {
            text-align: center;
            margin-top: 20px;
        }

        .button-container {
            text-align: center;
            margin: 20px;
        }

        button {
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
        }

        .delete-btn {
            background-color: #dc3545;
        }

        .edit-btn {
            background-color: #28a745;
        }

        #taskList {
            width: 80%;
            margin: auto;
        }

        .task {
            border: 1px solid #ccc;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 5px;
            background-color: white;
        }

        .completed {
            background-color: #d4edda;
        }

        .pending {
            background-color: #fff3cd;
        }

        #formContainer {
            width: 80%;
            margin: 20px auto;
            background: white;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            display: none;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }

        #message {
            text-align: center;
            color: green;
            margin: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h2>Task Manager System</h2>
</header>

<h1>Task Dashboard</h1>

<div id="message"></div>

<div class="button-container">
    <button onclick="loadTasks()">Load Tasks</button>
    <button onclick="loadTasks()">Refresh</button>
    <button onclick="showAddForm()">Add Task</button>
</div>

<div id="formContainer">
    <h3 id="formTitle">Add Task</h3>

    <label>Title</label>
    <input type="text" id="title">

    <label>Description</label>
    <textarea id="description"></textarea>

    <label>Status</label>
    <input type="text" id="status">

    <label>Due Date</label>
    <input type="text" id="due_date">

    <button onclick="saveTask()">Save</button>
    <button onclick="hideForm()">Cancel</button>
</div>

<div id="taskList"></div>

<script>

let editTaskId = null;

function showMessage(msg) {
    document.getElementById("message").innerText = msg;
}

function showAddForm() {
    editTaskId = null;
    document.getElementById('formTitle').innerText = 'Add Task';
    document.getElementById('title').value = '';
    document.getElementById('description').value = '';
    document.getElementById('status').value = '';
    document.getElementById('due_date').value = '';
    document.getElementById('formContainer').style.display = 'block';
}

function hideForm() {
    document.getElementById('formContainer').style.display = 'none';
}

function loadTasks() {
    fetch('http://localhost:3000/tasks')
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById('taskList');
            container.innerHTML = '';

            data.forEach(task => {
                const div = document.createElement('div');
                div.classList.add('task');

                if (task.status === 'completed') {
                    div.classList.add('completed');
                } else {
                    div.classList.add('pending');
                }

                div.innerHTML = `
                    <strong>${task.title}</strong><br>
                    ${task.description}<br>
                    <b>Status:</b> ${task.status}<br>
                    <b>Due:</b> ${task.due_date}<br><br>
                    <button class="edit-btn" onclick="editTask(${task.id})">Edit</button>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">Delete</button>
                `;

                container.appendChild(div);
            });
        });
} 

function saveTask() {
    const task = {
        title: document.getElementById('title').value,
        description: document.getElementById('description').value,
        status: document.getElementById('status').value,
        due_date: document.getElementById('due_date').value
    };

    if (editTaskId) {
        fetch(`http://localhost:3000/tasks/${editTaskId}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(task)
        }).then(() => {
            showMessage("Task updated successfully!");
            hideForm();
            loadTasks();
        });
    } else {
        fetch('http://localhost:3000/tasks', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(task)
        }).then(() => {
            showMessage("Task added successfully!");
            hideForm();
            loadTasks();
        });
    }
}

function editTask(id) {
    fetch(`http://localhost:3000/tasks/${id}`)
        .then(res => res.json())
        .then(task => {
            editTaskId = id;
            document.getElementById('formTitle').innerText = 'Edit Task';
            document.getElementById('title').value = task.title;
            document.getElementById('description').value = task.description;
            document.getElementById('status').value = task.status;
            document.getElementById('due_date').value = task.due_date;
            document.getElementById('formContainer').style.display = 'block';
        });
}

function deleteTask(id) {
    if (confirm("Are you sure you want to delete this task?")) {
        fetch(`http://localhost:3000/tasks/${id}`, {
            method: 'DELETE'
        }).then(() => {
            showMessage("Task deleted successfully!");
            loadTasks();
        });
    }
}

</script>

</body>
</html>
